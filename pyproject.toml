[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robustfl-bench"
version = "0.2.0"
description = "Robust federated learning benchmark and FedPARETO research implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Soumya Mazumdar", email = "reachme@soumyamazumdar.com"}]
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.24",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "tqdm>=4.66"
]

[project.urls]
Repository = "https://github.com/mazumdarsoumya/RobustFL-Bench"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
